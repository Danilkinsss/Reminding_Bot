# /daily_commit.yml
name: Daily Commit

on:
  schedule:
    # Runs 3× per weekday at 10:00 / 14:00 / 18:00 CET
    - cron: '0 9,13,17 * * 1-5' # 09/13/17 UTC = 10/14/18 CET
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check if we should commit
        id: should_commit
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "action=commit" >> $GITHUB_OUTPUT
            echo "🧪 Manual run detected — forcing commit"
          else
            # shouldRun.js writes action= (skip_day | skip_hour | commit) to $GITHUB_OUTPUT
            node .github/scripts/shouldRun.js
          fi

      - name: Exit if day is skipped
        if: steps.should_commit.outputs.action == 'skip_day'
        run: echo "🚫 Skipping today entirely"

      - name: Exit if not the chosen hour
        if: steps.should_commit.outputs.action == 'skip_hour'
        run: echo "🚫 Not the chosen hour for today"

      - name: Perform daily commit(if needed)
        if: steps.should_commit.outputs.action == 'commit'
        env:
          TZ: Europe/Paris
        run: |
          TODAY=$(date +%Y-%m-%d)

          # ---- GUARD: already committed today? ----
          if git log --since="00:00" --pretty=format:%s | grep -qx "Daily: $TODAY"; then
            echo "🛑 Commit already exists for today ($TODAY)"
            exit 0
          fi

          # ---- COMMIT (no sleep, no stamping — commit takes its natural run time) ----
          echo "✅ Daily update on $TODAY" >> logs.txt

          git config user.name "Danilkinsss"
          git config user.email "danil.kzn2003@gmail.com"

          git add logs.txt
          git diff --cached --quiet && exit 0
          git commit -m "Daily: $TODAY"

          git push origin main